---

- name: Reload haproxy
  ansible.builtin.service:
    name: haproxy
    state: reloaded
  changed_when: true

- name: Reload haproxy container
  ansible.builtin.command:
    cmd: docker compose -f {{ docker_root }}/{{ haproxy_container_name }}/docker-compose.yml restart
  changed_when: true

- name: Restart rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted
